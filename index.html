<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Finger Racer 🏎️</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(#78c8ff,#dff5ff);font-family:Arial,sans-serif;overflow:hidden;touch-action:none}
#game{display:block;margin:auto;background:#222;max-width:100vw;max-height:100vh}
#ui{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:min(94vw,700px);display:flex;justify-content:space-between;color:white;font-weight:bold;font-size:18px;z-index:3;pointer-events:none}
#start,#over{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(10,35,55,.58);color:#fff;z-index:5;text-align:center}
#over{display:none}.title{font-size:42px;font-weight:900;margin-bottom:8px}.sub{opacity:.85;margin-bottom:22px}
button{border:0;border-radius:14px;padding:14px 28px;font-size:19px;font-weight:bold;background:#fff;cursor:pointer}
#controls{position:fixed;bottom:22px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;z-index:4;pointer-events:none}
.ctrl{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid rgba(255,255,255,.5);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;pointer-events:auto;user-select:none}
@media(min-width:800px){#controls{display:none}}
</style>
</head>
<body>
<canvas id="game" width="420" height="760"></canvas>
<div id="ui"><span>🏆 Score: <b id="score">0</b></span><span>⚡ <b id="speed">1</b>x</span></div>
<div id="start"><div class="title">☝️ FINGER RACER</div><div class="sub">Drive the finger car. Dodge traffic. Survive!</div><button id="play">START RACE</button></div>
<div id="over"><div class="title">💥 CRASH!</div><div class="sub">Score: <b id="final">0</b></div><button id="again">RACE AGAIN</button></div>
<div id="controls"><div class="ctrl" id="left">◀</div><div class="ctrl" id="right">▶</div></div>

<script>
const c=document.getElementById("game"),x=c.getContext("2d");
const W=c.width,H=c.height;
let player,enemies,roadY,score,speed,playing,last,spawn,touchDir=0,high=+localStorage.fingerHigh||0;

function reset(){
 player={x:W/2,y:H-165,w:110,h:170,vx:0};
 enemies=[];roadY=0;score=0;speed=5;spawn=0;playing=true;last=performance.now();
 document.getElementById("start").style.display="none";
 document.getElementById("over").style.display="none";
 requestAnimationFrame(loop);
}
function rr(px,py,w,h,r){x.beginPath();x.roundRect(px,py,w,h,r);x.fill()}
function drawRoad(){
 // bright daytime sky / roadside
 x.fillStyle="#79c96b";x.fillRect(0,0,W,H);
 // subtle roadside stripes
 for(let yy=(roadY%70)-70;yy<H;yy+=70){
   x.fillStyle="#e7e7e7";x.fillRect(0,yy,45,35);x.fillRect(W-45,yy,W,35);
 }
 // asphalt
 let g=x.createLinearGradient(45,0,W-45,0);g.addColorStop(0,"#3d4349");g.addColorStop(.5,"#565c61");g.addColorStop(1,"#3d4349");
 x.fillStyle=g;x.fillRect(45,0,W-90,H);
 // road edges
 x.fillStyle="#f7f7f7";x.fillRect(40,0,5,H);x.fillRect(W-45,0,5,H);
 // center lane
 x.strokeStyle="#fff";x.lineWidth=6;x.setLineDash([38,28]);x.lineDashOffset=roadY;
 x.beginPath();x.moveTo(W/2,0);x.lineTo(W/2,H);x.stroke();x.setLineDash([]);
 // yellow shoulder markers
 for(let yy=(roadY%88)-88;yy<H;yy+=88){
   x.fillStyle="#ffd447";x.fillRect(18,yy,10,42);x.fillRect(W-28,yy,10,42);
 }
}
function drawFingerCar(){
 let p=player,cx=p.x;
 // soft shadow
 x.fillStyle="rgba(0,0,0,.20)";rr(cx-43,p.y+12,86,p.h-4,24);

 // FOUR LARGE, CLEARLY VISIBLE WHEELS
 for(const wx of [cx-45,cx+29])for(const wy of [p.y+48,p.y+104]){
   x.fillStyle="#111";rr(wx,wy,17,36,8);
   x.fillStyle="#4b4b4b";rr(wx+3,wy+4,11,28,5);
   x.fillStyle="#aaa";x.beginPath();x.arc(wx+8.5,wy+18,4,0,Math.PI*2);x.fill();
 }

 // No car body / no red cabin: only a tiny neutral axle/support behind the finger
 x.fillStyle="#555";rr(cx-19,p.y+57,38,58,10);

 // LARGE REAL-HUMAN-STYLE ADULT FINGER
 x.save();x.translate(cx,p.y+48);
 let skin=x.createLinearGradient(-24,-58,26,70);
 skin.addColorStop(0,"#f4bc8c");
 skin.addColorStop(.32,"#df9a69");
 skin.addColorStop(.68,"#c97e54");
 skin.addColorStop(1,"#a96143");

 x.fillStyle=skin;x.beginPath();
 x.moveTo(-20,67);
 x.bezierCurveTo(-24,46,-22,25,-21,4);
 x.bezierCurveTo(-20,-12,-29,-25,-28,-40);
 x.bezierCurveTo(-27,-58,-16,-70,0,-71);
 x.bezierCurveTo(17,-70,27,-58,28,-40);
 x.bezierCurveTo(29,-25,20,-12,21,4);
 x.bezierCurveTo(22,25,24,46,20,67);
 x.closePath();x.fill();

 // natural side shading
 let shade=x.createLinearGradient(-25,0,25,0);
 shade.addColorStop(0,"rgba(111,55,38,.24)");
 shade.addColorStop(.48,"rgba(255,225,195,.06)");
 shade.addColorStop(1,"rgba(105,50,35,.25)");
 x.fillStyle=shade;x.beginPath();
 x.moveTo(-20,67);x.bezierCurveTo(-24,35,-19,0,-24,-30);
 x.bezierCurveTo(-28,-52,-15,-69,0,-71);
 x.bezierCurveTo(-10,-55,-9,-20,-10,10);
 x.bezierCurveTo(-10,35,-9,54,-7,67);x.closePath();x.fill();

 // fingertip highlight
 let hi=x.createRadialGradient(-8,-49,2,-8,-49,22);
 hi.addColorStop(0,"rgba(255,238,219,.72)");
 hi.addColorStop(1,"rgba(255,238,219,0)");
 x.fillStyle=hi;x.beginPath();x.arc(-8,-49,22,0,Math.PI*2);x.fill();

 // natural fingernail
 x.fillStyle="#f6d8c2";x.beginPath();
 x.moveTo(-12,-48);
 x.bezierCurveTo(-11,-59,11,-59,13,-48);
 x.bezierCurveTo(13,-39,8,-34,0,-34);
 x.bezierCurveTo(-8,-34,-12,-39,-12,-48);
 x.fill();
 x.strokeStyle="rgba(125,70,50,.35)";x.lineWidth=1.5;x.stroke();

 // subtle finger joints / skin folds
 x.strokeStyle="rgba(111,57,42,.34)";x.lineWidth=1.7;
 for(const yy of [-11,8,27]){
   x.beginPath();x.moveTo(-15,yy);x.quadraticCurveTo(0,yy+3,15,yy);x.stroke();
 }
 x.strokeStyle="rgba(255,225,201,.35)";x.lineWidth=2;
 x.beginPath();x.moveTo(-13,-5);x.quadraticCurveTo(-17,25,-12,52);x.stroke();

 x.restore();
}
function drawEnemy(e){
 // shadow + wheels
 x.fillStyle="rgba(0,0,0,.3)";rr(e.x-e.w/2+4,e.y+5,e.w,e.h,14);
 for(const wx of [e.x-e.w/2-6,e.x+e.w/2-9])for(const wy of [e.y+17,e.y+e.h-38]){
   x.fillStyle="#111";rr(wx,wy,15,28,6)
 }
 x.fillStyle=e.color;rr(e.x-e.w/2,e.y,e.w,e.h,14);
 x.fillStyle="#aee9ff";rr(e.x-e.w/2+12,e.y+14,e.w-24,28,8);
 x.fillStyle="#222";rr(e.x-e.w/2+12,e.y+48,e.w-24,31,8);
 x.fillStyle="#ffe66d";rr(e.x-e.w/2+8,e.y+7,12,9,3);rr(e.x+e.w/2-20,e.y+7,12,9,3);
}
function collide(a,b){
 return Math.abs(a.x-b.x)<(a.w+b.w)/2-12 && Math.abs((a.y+a.h/2)-(b.y+b.h/2))<(a.h+b.h)/2-12;
}
function loop(t){
 if(!playing)return;
 let dt=Math.min((t-last)/16.67,2);last=t;
 speed=Math.min(12,5+score/180);
 roadY+=speed*dt;
 player.x+=player.vx*dt;
 if(touchDir)player.x+=touchDir*6*dt;
 player.x=Math.max(95,Math.min(W-95,player.x));
 spawn-=dt;
 if(spawn<=0){
   let lanes=[120,210,300], lane=lanes[Math.floor(Math.random()*3)];
   enemies.push({x:lane,y:-130,w:72,h:115,color:["#2979ff","#8e24aa","#ff8f00","#00acc1"][Math.floor(Math.random()*4)]});
   spawn=Math.max(30,72-score/100);
 }
 for(let i=enemies.length-1;i>=0;i--){
   let e=enemies[i];e.y+=speed*(0.95+Math.random()*.03)*dt;
   if(collide(player,e)){gameOver();return}
   if(e.y>H+150){enemies.splice(i,1);score+=10}
 }
 document.getElementById("score").textContent=score;
 document.getElementById("speed").textContent=(speed/5).toFixed(1);
 drawRoad();enemies.forEach(drawEnemy);drawFingerCar();
 requestAnimationFrame(loop);
}
function gameOver(){
 playing=false;high=Math.max(high,score);localStorage.fingerHigh=high;
 document.getElementById("final").textContent=score+"  |  Best: "+high;
 document.getElementById("over").style.display="flex";
}
document.getElementById("play").onclick=reset;
document.getElementById("again").onclick=reset;
addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")touchDir=-1;if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")touchDir=1});
addEventListener("keyup",e=>{if(["ArrowLeft","ArrowRight","a","d"].includes(e.key))touchDir=0});
for(const [id,d] of [["left",-1],["right",1]]){
 let b=document.getElementById(id);
 b.onpointerdown=e=>{e.preventDefault();touchDir=d};b.onpointerup=()=>touchDir=0;b.onpointercancel=()=>touchDir=0;b.onpointerleave=()=>touchDir=0;
}
</script>
</body>
</html>
